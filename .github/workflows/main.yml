name: Build Windows GameHub EXE

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build Windows executable folder
        run: |
          pyinstaller --noconfirm --clean --windowed --name IndianBusSimulator --collect-all panda3d --collect-all direct main.py
      - name: Zip executable folder
        run: Compress-Archive -Path dist/IndianBusSimulator -DestinationPath IndianBusSimulator-Windows.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndianBusSimulator-Windows
          path: IndianBusSimulator-Windows.zip
          if-no-files-found: error
          
